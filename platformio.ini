; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = clearcue

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
monitor_filters = esp32_exception_decoder, time
monitor_dtr = 0
monitor_rts = 0

[env:clearcue]
; Shippable firmware: one binary, configured at runtime (captive portal / web flasher / LAN page).
; Build:   pio run -e clearcue         -> also writes web/manifest.json + web/firmware/*
; Flash:   pio run -e clearcue -t upload  (or the web flasher, or tools/batch_flash.ps1)
build_src_filter = +<clearcue/*.cpp>
; 2 x 1.9 MB OTA slots (default.csv leaves ~6% headroom in a 1.25 MB slot).
board_build.partitions = min_spiffs.csv
extra_scripts =
    pre:tools/wolfssl_config.py
    pre:tools/release.py
    post:tools/wolfssl_build.py
custom_product_name = ClearCue
; HTTPS origin that will host the contents of web/ (no trailing slash). Empty = no auto-update server.
custom_ota_base_url =
; Public repo for this firmware. Shown on the settings page with the GPLv3 notice
; (wolfSSL makes the firmware binary GPLv3; see NOTICE.md).
custom_source_url =
